    .value { fill: #DFE7EE; font-size: 18px; }
    .cell { opacity: 0.025; }
    @media (prefers-reduced-motion: no-preference) {
      .cell { animation: glow 18s ease-in-out infinite; }
      .cell-b { animation-delay: -6s; }
      .cell-c { animation-delay: -12s; }
    }
    @keyframes glow {
      0%, 15%, 75%, 100% { opacity: 0.025; }
      42% { opacity: 0.14; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell { animation: none; opacity: 0.025; }
    }
  </style>
