<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Till Cornely / crnly</title>
  <desc id="description">Detailed ASCII adaptation of Katsushika Hokusai’s Under the Wave off Kanagawa, cropped square. Business Informatics and Digital Media student at Stuttgart Media University (HdM). Foundations in Python, Linux/WSL and Docker. Learning Go. Interested in platform engineering, cloud/DevOps, agentic AI and security. Void is a planned project.</desc>
